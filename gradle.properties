# Gradle 데몬에 메모리 충분히 (멀티모듈 빌드 가속)
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# 병렬 빌드 (멀티모듈에서 큰 차이)
org.gradle.parallel=true

# 빌드 캐시 사용
org.gradle.caching=true

# 설정 단계 캐시 (Gradle 8+)
org.gradle.configuration-cache=true

# Gradle daemon JDK 는 머신마다 경로가 달라 커밋하지 않습니다.
# 시스템 java 가 21 이 아니면 (Gradle 8.11 은 Java 25+ 미지원) 다음 중 하나로 실행:
#   - JAVA_HOME=<JDK21 경로> ./gradlew ...
#   - ~/.gradle/gradle.properties 에 org.gradle.java.home=<JDK21 경로> 설정 (커밋 안 됨)
# CI 는 actions/setup-java 가 JDK 21 을 JAVA_HOME 으로 제공합니다.