[versions]
java = "21"
# [Phase R30] R30/AC-R30-04/R30/AC-R30-07 — 3.4.1 → 3.5.16(두 단계 판올림의 첫 단계 · 설계 DD-R30-02 판 고정 · 사용자 명시 결정 「길 ⓐ 전면 이행」).
springBoot = "3.5.16"
springDependencyMgmt = "1.1.7"
byteBuddy = "1.17.8"
# [Phase R30] R30/AC-R30-07 — 아래 셋(flyway · jupiter · mockito)은 그 단계 서버 BOM 값에 맞춘다(설계 DD-R30-03 ·
#   BOM 밖 agent · common 시험이 서버와 같은 판을 쓰게). sqliteJdbc 는 엔진 교체를 4.1 한 번으로 모으려고 3.5 에서 그대로.
flyway = "11.7.2"
sqliteJdbc = "3.47.1.0"
jackson = "2.18.2"
jupiter = "5.12.2"
mockito = "5.17.0"
# [Phase R16] FR-01/게이트 B — springdoc-openapi 버전 SSOT (카탈로그가 유일 출처, 인라인 magic version 금지).
# Spring Boot 3.4.x 정렬 릴리스 = 2.7.0. dev/QA 가 `./gw build` 로 3.4.1 호환 실증 후 확정(게이트 B).
springdoc = "2.7.0"

[libraries]
# Spring Boot
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "springBoot" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version.ref = "springBoot" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "springBoot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "springBoot" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator", version.ref = "springBoot" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc", version.ref = "springBoot" }

# API 문서 자동화 (server 전용 — agent shadowJar/relocate 경로 유입 0)
# [Phase R16] FR-01 — 신규 식별자 단일명(별칭 참조: libs.springdoc.openapi.starter.webmvc.ui).
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

# Persistence
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
# [Phase R30] R30/AC-R30-07 — dialects 는 판을 적지 않는다(서버 BOM 이 core 와 같은 판을 준다 · 직접 선언 판이 BOM 을
#   이기던 6.5.3 고정을 끊는다 · 설계 DD-R30-03). 서버만 쓰는 별칭이다 — agent 시험은 서버 의존에서 이것을 뺀다.
hibernate-community-dialects = { module = "org.hibernate.orm:hibernate-community-dialects" }

# Agent (instrumentation)
bytebuddy = { module = "net.bytebuddy:byte-buddy", version.ref = "byteBuddy" }
bytebuddy-agent = { module = "net.bytebuddy:byte-buddy-agent", version.ref = "byteBuddy" }

# JSON (agent uses standalone Jackson, server uses Spring's)
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }

# Test
jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "jupiter" }
jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "jupiter" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
# [Phase R30] R30/AC-R30-01 — 시험 실행기(launcher)를 모듈마다 직접 선언한다(루트 build.gradle.kts subprojects).
#   Gradle 이 시험 실행기를 스스로 끌어오던 옛 동작은 Gradle 9 에서 없어진다 — 지금 선언해 두어야 9 로 올려도 시험이 돈다.
#   launcher 는 판을 적지 않는다: junit-bom(판 = jupiter 키)이 판을 준다 — BOM 밖 모듈(agent · common)도 같은 길로 판을 얻는다.
junit-bom = { module = "org.junit:junit-bom", version.ref = "jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyMgmt" }
