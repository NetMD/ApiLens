# ApiLens server 기본 설정
# 운영자가 customize 필요한 항목은 환경변수 또는 application-local.yml로 override

server:
  port: 8765  # 8080 충돌 회피 (사용자 앱이 보통 8080)
  # 사내 프록시 환경에서 trace 상세(spans + attributes) 응답 압축 — 100~200 span도 가볍게
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024

spring:
  application:
    name: apilens-server

  # SQLite 데이터소스
  # 데이터 파일은 실행 위치 기준 ./apilens.db 에 생성됨
  # [Phase R12] AC-A2-1 — D-04 비협상 (운영 DB 파일 삭제 금지 — PRAGMA 는 행 내 설정일 뿐).
  # CLAUDE.md '절대 변경 금지 §2' (SQLite+Flyway) 인용.
  # PRAGMA 는 URL 쿼리 파라미터로 — 풀의 모든 connection 생성 시점에 적용됨 (Design §2-A2):
  #   journal_mode=WAL      ingest 쓰기가 UI 읽기를 막지 않게 (persistent — 매 connection 재실행 무해)
  #   synchronous=NORMAL    WAL 권장 조합
  #   busy_timeout=5000     writer 경합 시 5초 대기 (connection 수준 — URL 적용이 유일하게 안전)
  # auto_vacuum 은 URL 로 넣지 않는다 (실측 — DbPragmaTest V-06 봉인): sqlite-jdbc 3.47.1 의
  #   SQLiteConfig.Pragma 에 AUTO_VACUUM 이 없어 URL 파라미터가 silent drop 된다.
  #   INCREMENTAL 전환(신규/기존 DB 공통)은 StartupDbInitializer 가 동일 connection 에서
  #   PRAGMA + VACUUM 1회 수행 (멱등 — Design §2-A2 결정 2 의 ApplicationRunner 축이 전담).
  # foreign_keys 는 OFF 유지 (확정 — Design §2-A2-FK): REPLACE cascade 의 payload 소실 부수효과 차단.
  # [Phase R17] FR-02 — 거대 trace 적재 청크 커밋 즉시완화(server)의 보조 레버 파라미터 4종.
  #   근본 레버는 IngestService 청크 커밋(FR-01)이고, 아래는 그 뒤의 보조 헤드룸이다(측정으로 튜닝 가능).
  datasource:
    # [Phase R17] FR-02 — busy_timeout 5000 → 10000 (ms, GT-4 URL PRAGMA 정상 작동 확인).
    #   청크 커밋으로 개별 lock 이 짧아진 뒤 다중 writer 대기 헤드룸. lock 보유가 10s 를 넘기면 여전히 유실(완화지 제거 아님).
    url: jdbc:sqlite:apilens.db?journal_mode=WAL&synchronous=NORMAL&busy_timeout=10000
    driver-class-name: org.sqlite.JDBC
    # [Phase R17] FR-02 — HikariCP pool + wal_autocheckpoint (OQ-B / OQ-C).
    hikari:
      # OQ-B: SQLite 는 writer 1개라 write 는 어차피 직렬. read/write 분리 안 함 — WAL 이 다수 reader + 1 writer 를
      #   지원하므로 커넥션만 충분하면 UI 조회(read)가 ingest write 뒤에서 막히지 않는다. 기본 10 → 4 (개수, connections).
      maximum-pool-size: 4
      # wal_autocheckpoint 는 URL 이 아니라 connection-init-sql 로 넣는다 — R12 auto_vacuum URL silent-drop 함정 회피(GT-3).
      #   dev STEP 0 실측: statement 실행 시 read-back=10000, URL 미실행 기본=1000. 모든 pool 커넥션 생성 시 1회 실행.
      #   기본 1000 → 10000 (pages ≈ 40MB) — 적재 버스트 중 체크포인트 빈도↓ 로 청크 커밋 lock 보유가 더 일정.
      connection-init-sql: "PRAGMA wal_autocheckpoint=10000"

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      # 스키마는 Flyway가 관리. JPA는 검증만
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Actuator: 헬스체크용
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when_authorized

# ApiLens 자체 설정
apilens:
  # [Phase K] AC-01-1/AC-02-1 — API Key 인증 (R14-D02/D03/D08, v0.3 신설).
  # 관리/조회 API(/v1/** 보호 묶음)에 단일 토큰 헤더 검증을 적용한다.
  # ⚠️ 토큰 SSOT 는 server 起動 옵션 — DB 저장 안 함(R14-D03). 키 회전 = server 재시작.
  #   env  : APILENS_AUTH_API_KEY=<토큰>            (운영 권장 — Spring relaxed binding 으로 매핑)
  #   또는 : -Dapilens.auth.api-key=<토큰>          (시스템 프로퍼티, env 보다 우선)
  # 값을 비워두면 무인증 폴백으로 기동(0.2.1 동일 동작) + 기동 WARN 1회(R14-D08).
  # ingest(POST /v1/spans)·setup·actuator/health·정적/SPA 는 무토큰 면제(R14-D04 — agent 무변경).
  auth:
    api-key:  # 비워둠 — env/시스템 프로퍼티로 주입 (무인증 폴백 시 비활성)
  ingest:
    # 개별 payload body 의 최대 저장 크기 (byte). 초과 시 server 가 한도까지 잘라 저장 + truncated=true
    # (agent 가 64KB 로 못 자른 거대 payload 방어용 안전망 — mask 적용 후 측정·절단, UTF-8 경계 보존).
    max-payload-bytes: 1048576  # 1 MB
  retention:
    # 보관 기간(일). 설정 페이지 저장 값(settings DB)이 이 값보다 우선 — 이 키는 settings 미설정 시 fallback (D-05).
    # cleanup 은 아래 cleanup-cron 스케줄로 실행 (payloads → spans → traces 행 단위 DELETE — 파일 삭제 0, D-04).
    days: 30
    # cleanup 실행 시각 (Spring cron 6필드, 기본 매일 04:00). settings(DB) 노출 안 함 — yml 전용 (Design §2-A1).
    cleanup-cron: "0 0 4 * * *"

logging:
  # [Phase R17] FR-03 — stdout 전용 → 파일화. SQLITE_BUSY 유실 카운터의 WARN 이 여기 누적돼
  #   유실률 기준선 비교처가 된다(로그 파일 grep). Spring Boot 기본 롤링(파일당 10MB, 이력 cap) 적용.
  file:
    name: logs/apilens.log
  level:
    root: INFO
    # [Phase R20] R20/AC-09-1 — DEBUG → INFO (로그 위생, Q-3③). hikari 로거 레벨은 무접촉 —
    #   Retrograde 잡음은 logback-spring.xml 의 message 조건 DENY 가 전담(불변식 11).
    io.apilens: INFO
