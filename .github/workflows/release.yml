name: Release

# v* 태그를 push 하면 UI + jar 를 빌드하고 GitHub Release 를 생성해 jar 두 개를 첨부합니다.
#   git tag -a v0.1.0 -m "ApiLens v0.1.0"
#   git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Release 생성 + asset 업로드 권한

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. UI 빌드 (server jar 에 임베드되려면 dist 가 먼저 있어야 함)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apilens-ui/package-lock.json

      - name: Build UI
        working-directory: apilens-ui
        run: |
          npm ci
          npm run build

      # 2. agent shadow jar + server bootJar (UI 임베드) 빌드
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build jars
        run: ./gradlew clean build

      # 3. 배포 산출물 2종 선별(bootJar + agent jar; plain/sources 제외) + UI 임베드 검증
      #    libs 에는 boot/plain/sources jar 가 공존하므로 plain·sources 를 명시 제외해야
      #    bootJar 를 정확히 고른다 (단순 head -1 은 plain jar 를 집어 검증 실패).
      - name: Stage & verify release artifacts
        run: |
          mkdir -p release-dist
          SERVER_JAR=$(ls apilens-server/build/libs/apilens-server-*.jar | grep -vE 'plain|sources' | head -1)
          AGENT_JAR=$(ls apilens-agent/build/libs/apilens-agent-*.jar | grep -vE 'sources' | head -1)
          echo "server=$SERVER_JAR"
          echo "agent=$AGENT_JAR"
          if [ -z "$SERVER_JAR" ] || [ -z "$AGENT_JAR" ]; then
            echo "ERROR: 산출물 jar 누락 (server=$SERVER_JAR agent=$AGENT_JAR)"
            exit 1
          fi
          if ! unzip -l "$SERVER_JAR" | grep -q "BOOT-INF/classes/static/index.html"; then
            echo "ERROR: UI not embedded in server jar"
            exit 1
          fi
          echo "OK: UI embedded"
          cp "$SERVER_JAR" "$AGENT_JAR" release-dist/

      # 4. Release 생성 + jar 2종 첨부
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ApiLens ${{ github.ref_name }}
          body_path: release-notes/${{ github.ref_name }}.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          files: |
            release-dist/*.jar
          fail_on_unmatched_files: true
