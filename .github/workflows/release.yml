name: Release

# v* 태그를 push 하면 UI + jar 를 빌드하고 GitHub Release 를 생성해 jar 두 개를 첨부합니다.
#   git tag -a vX.Y.Z -m "ApiLens vX.Y.Z"
#   git push origin vX.Y.Z
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Release 생성 + asset 업로드 권한

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # [Phase R26] R26/AC-R26-39/R26/AC-R26-40 — 아래 조상 검사가 보려면 **전체 이력**이 필요하다.
          #   기본값(얕은 받기)이면 merge-base 가 볼 커밋이 없어 검사가 **조용히 실패**한다 —
          #   그 실패는 "통과" 와 구별이 안 되므로, 이 줄과 아래 검사 단계는 **한 쌍**이다. 하나만 넣지 말 것.
          fetch-depth: 0

      # 0. 그물 둘 — 긴 빌드 **앞**에서 실패를 낸다(Create Release 앞이라는 조건도 자동 충족).
      # [Phase R26] R26/AC-R26-39 — ① 태그가 붙은 커밋이 main 의 조상인가.
      #   지금까지 이것은 사람 기억에 맡겨져 있었다 — main 밖 커밋에 태그하면 검사망이 **0회** 돈다.
      #   원격 참조 이름이 만들어지는지에 안 기대려고 FETCH_HEAD 로 본다.
      - name: Verify the tagged commit is an ancestor of main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "ERROR: 태그가 붙은 커밋이 main 의 조상이 아닙니다."
            echo "  main 에 밀린 커밋에 태그하세요 — 그래야 이 커밋이 검사망을 한 번은 지나갑니다."
            exit 1
          fi
          echo "OK: tagged commit is an ancestor of main."

      # [Phase R26] R26/AC-R26-39 — ② 릴리스 노트 파일이 실제로 있는가.
      #   아래 Create Release 단계가 이 파일을 본문으로 읽는다. 없으면 릴리스 본문이 **빈 채로** 만들어진다.
      - name: Verify the release notes file exists
        # [Phase R26 · SEC-R26-01] 태그 이름은 **밖에서 정하는 값**이다. 워크플로 식({{ }} 형태)은
        #   대본이 돌기 **전에** 글자로 치환되므로, 그것을 run: 안에 바로 쓰면 태그 이름에 든
        #   쉘 특수문자가 그대로 명령이 된다(git 은 태그 이름에 ; | & $ ` ( ) 를 허용한다).
        #   ★값은 env: 로 넘기고 대본에서는 "$TAG_NAME" 으로 읽는다 — 환경 변수 값은 다시 해석되지 않는다.
        #   ★이 두 줄(env 와 아래 읽는 자리)은 **한 쌍**이다. 하나만 되돌리면 구멍이 다시 열린다.
        #   회귀 가드: ci.yml 의 "Guard — no workflow expression inside a run: script".
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          NOTES="release-notes/${TAG_NAME}.md"
          if [ ! -s "$NOTES" ]; then
            echo "ERROR: $NOTES 가 없거나 비어 있습니다 — 릴리스 본문이 빈 채로 만들어집니다."
            ls -la release-notes || true
            exit 1
          fi
          echo "OK: $NOTES present."

      # 1. UI 빌드 (server jar 에 임베드되려면 dist 가 먼저 있어야 함)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apilens-ui/package-lock.json

      - name: Build UI
        working-directory: apilens-ui
        run: |
          npm ci
          npm run build

      # 2. agent shadow jar + server bootJar (UI 임베드) 빌드
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build jars
        run: ./gradlew clean build

      # 3. 배포 산출물 2종 선별(bootJar + agent jar; plain/sources 제외) + UI 임베드 검증
      #    libs 에는 boot/plain/sources jar 가 공존하므로 plain·sources 를 명시 제외하고
      #    글롭 매칭 개수 = 1 을 단언한다 — 0개(미산출)도 2개 이상(stale
      #    혼입·선별 실패)도 즉시 실패가 검출기. 첫 항목 자르기(head)로 임의 선택하지 않는다.
      - name: Stage & verify release artifacts
        run: |
          mkdir -p release-dist
          shopt -s nullglob
          SERVER_JARS=()
          for f in apilens-server/build/libs/apilens-server-*.jar; do
            case "$f" in *plain*|*sources*) ;; *) SERVER_JARS+=("$f");; esac
          done
          AGENT_JARS=()
          for f in apilens-agent/build/libs/apilens-agent-*.jar; do
            case "$f" in *sources*) ;; *) AGENT_JARS+=("$f");; esac
          done
          if [ ${#SERVER_JARS[@]} -ne 1 ] || [ ${#AGENT_JARS[@]} -ne 1 ]; then
            echo "ERROR: 산출물 jar 매칭 개수 비정상 (server=${#SERVER_JARS[@]}, agent=${#AGENT_JARS[@]}) — 정확히 1개여야 합니다"
            echo "server candidates: ${SERVER_JARS[*]:-'(none)'}"
            echo "agent candidates: ${AGENT_JARS[*]:-'(none)'}"
            exit 1
          fi
          SERVER_JAR=${SERVER_JARS[0]}
          AGENT_JAR=${AGENT_JARS[0]}
          echo "server=$SERVER_JAR"
          echo "agent=$AGENT_JAR"
          if ! unzip -l "$SERVER_JAR" | grep -q "BOOT-INF/classes/static/index.html"; then
            echo "ERROR: UI not embedded in server jar"
            exit 1
          fi
          echo "OK: UI embedded"
          cp "$SERVER_JAR" "$AGENT_JAR" release-dist/

      # 4. Release 생성 + jar 2종 첨부
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ApiLens ${{ github.ref_name }}
          body_path: release-notes/${{ github.ref_name }}.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          files: |
            release-dist/*.jar
          fail_on_unmatched_files: true
