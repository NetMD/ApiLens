# ApiLens CI — backend(Gradle/JDK 21 + smoke 시험 JVM 27) + frontend(Node 20 · npm audit) + 단일 jar 임베드 검증
# + agent shadow jar relocate clean / 회귀 가드 grep / 지원 라인 가드.
# [Phase R30] R30/AC-R30-30 — 액션은 그날 최신 메이저(2026-10-28 20:12 releases API 실측 · 전부 node24) · 러너 ubuntu-24.04 고정.

name: ApiLens CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# [Phase R26] R26/AC-R26-37 — 토큰 권한을 읽기로 좁힌다. 이 검사망은 저장소에 아무것도 안 쓴다
#   (릴리스 생성은 release.yml 이 자기 job 에서 쓰기 권한을 따로 선언한다).
permissions:
  contents: read

jobs:
  # ============================================================
  # Job 1: backend-test
  #   Gradle clean test (matrix JDK 21 primary + 시험 JVM 27 smoke)
  #   빌드·테스트·shadow jar relocate 검증을 한 job 에 묶는다
  # [Phase R30] R30/AC-R30-31 — smoke 다리는 Gradle 을 JDK 21 로 돌리고 server · common 시험 JVM 만 27 로 띄운다
  #   (Gradle 8.14 는 JDK 27 위에서 데몬이 안 선다 · agent 시험은 21 — Byte Buddy 1.17.8 지원 범위).
  #   판정은 smoke 다리 끝 notice 한 줄(단계 outcome 8 + 시험 JVM 판)이다 — 단계 실패는 smoke 다리에서 삼켜진다.
  # ============================================================
  backend-test:
    name: Backend (Gradle / JDK ${{ matrix.jdk }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - jdk: '21'
            test_jdk: ''  # 시험 JVM = 컴파일 toolchain 21
            smoke: false  # 기본 빌드 대상 — 이 JDK 에서 실패하면 CI 실패
          - jdk: '27'
            test_jdk: '27'  # server · common 시험 JVM 27(사용자 명시 결정 「27 로 바꿔 유지」)
            smoke: true   # 상위 JDK 런타임 확인용 — 실패해도 CI 는 계속(아래 continue-on-error)
    steps:
      - uses: actions/checkout@v7

      # smoke 다리만: 시험 JVM 27 을 먼저 깔고(JAVA_HOME_27_X64) 아래에서 21 을 기본 JAVA_HOME 으로 덮는다.
      - name: Setup test JDK ${{ matrix.test_jdk }} (smoke only)
        if: ${{ matrix.smoke }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.test_jdk }}
          distribution: temurin

      - name: Setup JDK 21 (Gradle daemon · compile toolchain)
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      # Gradle toolchain 이 위에서 깐 27 을 찾게 한다(자동 탐지 경로 밖이라 환경 변수 이름을 알려 준다).
      - name: Point Gradle toolchains at the test JDK (smoke only)
        if: ${{ matrix.smoke }}
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_27_X64" >> "$HOME/.gradle/gradle.properties"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}

      - name: Verify Gradle wrapper present
        id: wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            echo "ERROR: gradle wrapper not generated. Run: gradle wrapper --gradle-version 8.14.6"
            exit 1
          fi
        continue-on-error: ${{ matrix.smoke }}

      - name: License header check (idempotent)
        id: license
        run: bash scripts/apply-license-header.sh --check
        continue-on-error: ${{ matrix.smoke }}

      # [Phase R26 · SEC-R26-01 회귀 가드] 워크플로우 식을 run: 대본 안에 직접 쓰면
      #   그 값이 대본이 돌기 전에 글자로 박혀 임의 명령이 된다(태그·가지 이름은 밖에서 정하는 값이다).
      #   값은 env: 로 넘기고 대본에서는 "$VAR" 로 읽는다.
      #   ★ 이 가드의 검사 대본은 찾을 무늬를 조각으로 이어 만든다 — 그래야 가드가 자기 선언문을 안 잡는다.
      #   예상 hit 수 = 0 (0 이 「그런 자리가 없다」는 뜻이다 — 2026-09-15 수정 전에는 release.yml 한 줄이 잡혔다).
      - name: "Guard — no workflow expression inside a run: script"
        id: exprguard
        run: |
          FOUND=$(awk '
            BEGIN { pat = "$" "{" "{" }
            /^[[:space:]]*run:[[:space:]]*[|>]/ { inrun=1; ind=index($0, "run:"); next }
            /^[[:space:]]*run:[[:space:]]*[^|>[:space:]]/ {
              if (index($0, pat) > 0) { print FILENAME ":" FNR ": " $0 }
              inrun=0; next
            }
            {
              if (inrun && $0 ~ /[^[:space:]]/) {
                cur = match($0, /[^ ]/)
                if (cur <= ind) { inrun = 0 }
              }
              if (inrun && index($0, pat) > 0) { print FILENAME ":" FNR ": " $0 }
            }
          ' .github/workflows/*.yml)
          if [ -n "$FOUND" ]; then
            echo 'ERROR: run: 대본 안에 워크플로우 식이 있습니다 — 값은 env: 로 넘기고 대본에서는 환경 변수로 읽으세요.'
            echo "$FOUND"
            exit 1
          fi
          echo "OK: no workflow expression inside any run: script."
        continue-on-error: ${{ matrix.smoke }}

      # [Phase R30] R30/AC-R30-31 — 시험 JVM 판은 Gradle 속성 apilensTestJdk(환경 변수로만 넘긴다 · 위 식 가드) ·
      #   빈 값이면 21. 빌드 캐시를 끈다 — 캐시에서 시험 결과를 꺼내 오면 시험이 실제로 안 돈다.
      - name: Clean build + test
        id: test
        env:
          ORG_GRADLE_PROJECT_apilensTestJdk: ${{ matrix.test_jdk }}
        run: ./gradlew clean test --no-build-cache
        continue-on-error: ${{ matrix.smoke }}

      - name: Build shadow jar (agent)
        id: shadow
        run: ./gradlew :apilens-agent:shadowJar
        continue-on-error: ${{ matrix.smoke }}

      - name: Verify shadow jar relocate clean (D-01 인용)
        id: relocate
        run: |
          # apilens-agent 의 shadow jar 안에 raw bytebuddy / jackson 클래스 0 hit 검증
          # 글롭 매칭 1개 단언 — 0개(미산출)/2개 이상(stale 혼입) 즉시 실패
          mapfile -t AGENT_JARS < <(find apilens-agent/build/libs -name 'apilens-agent*.jar' -not -name '*sources*' -not -name '*plain*' | sort)
          if [ ${#AGENT_JARS[@]} -ne 1 ]; then
            echo "ERROR: agent shadow jar 매칭 개수 비정상 (${#AGENT_JARS[@]}) — 정확히 1개여야 합니다: ${AGENT_JARS[*]:-'(none)'}"
            exit 1
          fi
          AGENT_JAR=${AGENT_JARS[0]}
          jar tf "$AGENT_JAR" | tee /tmp/agent-jar-entries.txt > /dev/null
          # raw 패키지 (relocate 안 된 클래스) 0 hit
          if grep -E '^net/bytebuddy/' /tmp/agent-jar-entries.txt; then
            echo "ERROR: raw net.bytebuddy.* classes leaked into shadow jar (D-01 violation)."
            exit 1
          fi
          if grep -E '^com/fasterxml/jackson/' /tmp/agent-jar-entries.txt; then
            echo "ERROR: raw com.fasterxml.jackson.* classes leaked into shadow jar (D-01 violation)."
            exit 1
          fi
          # relocated 패키지 (io/apilens/agent/shaded/bytebuddy/) 존재 확인
          # 미산출 = 빌드 불완전(relocate 미발생) → 경고가 아니라 즉시 실패.
          if ! grep -q '^io/apilens/agent/shaded/bytebuddy/' /tmp/agent-jar-entries.txt; then
            echo "ERROR: relocated bytebuddy entries not found — shadow jar relocate did not happen (V-1 FAIL)."
            exit 1
          fi
          echo "OK: shadow jar relocate clean."
        continue-on-error: ${{ matrix.smoke }}

      # javap -v 로 우리 클래스의 public API 에 raw(비-relocate)
      #   jackson/bytebuddy 참조가 0 임을 확인한다. jar 엔트리 grep(위 step)은 raw '클래스 파일'만 잡지만,
      #   이 step 은 우리 코드(io.apilens.agent.* / io.apilens.common.*, shaded 제외)의 constant pool·
      #   시그니처가 raw 패키지를 참조하지 않음(= relocate 누락 0)까지 검증한다. build script 단언 금지,
      #   javap 로 직접 검증한다(빌드 스크립트 안에서 단언하지 않는다).
      - name: Verify agent shadow jar javap relocate clean (V-1, no raw jackson/bytebuddy in our API)
        id: javap
        run: |
          mapfile -t AGENT_JARS < <(find apilens-agent/build/libs -name 'apilens-agent*.jar' -not -name '*sources*' -not -name '*plain*' | sort)
          if [ ${#AGENT_JARS[@]} -ne 1 ]; then
            echo "ERROR: agent shadow jar 매칭 개수 비정상 (${#AGENT_JARS[@]}) — 정확히 1개여야 합니다."
            exit 1
          fi
          AGENT_JAR=${AGENT_JARS[0]}
          WORK=$(mktemp -d)
          unzip -q "$AGENT_JAR" -d "$WORK"
          DISASM="$WORK/_apilens_disasm.txt"
          : > "$DISASM"
          # 우리 클래스만: io/apilens/agent/** (shaded 하위 제외) + io/apilens/common/** 의 .class 를 javap -v -p.
          while IFS= read -r f; do
            name=${f#"$WORK/"}; name=${name%.class}; name=${name//\//.}
            javap -v -p -classpath "$WORK" "$name" >> "$DISASM" 2>/dev/null || true
          done < <(
            find "$WORK/io/apilens/agent" -type d -name shaded -prune -o -name '*.class' -print
            [ -d "$WORK/io/apilens/common" ] && find "$WORK/io/apilens/common" -name '*.class' -print
          )
          # (1) 우리 클래스가 raw jackson/bytebuddy 를 참조하면 relocate 누락 → FAIL.
          #     shaded 는 io.apilens.agent.shaded.{jackson,bytebuddy} 라 이 패턴에 안 걸림(false-positive 0).
          if grep -Eq 'com[./]fasterxml[./]jackson|net[./]bytebuddy' "$DISASM"; then
            echo "ERROR: our classes reference RAW jackson/bytebuddy (relocate leak) — V-1 FAIL:"
            grep -En 'com[./]fasterxml[./]jackson|net[./]bytebuddy' "$DISASM" | head -20
            exit 1
          fi
          # (2) relocate 가 실제로 발생했다는 증거 — shaded 참조 ≥ 1 (미발견 = shadowJar relocate 미동작).
          if ! grep -q 'io[./]apilens[./]agent[./]shaded[./]' "$DISASM"; then
            echo "ERROR: no relocated (io.apilens.agent.shaded.*) references found — relocate did not happen (V-1 FAIL)."
            exit 1
          fi
          echo "OK: javap relocate clean — 0 raw jackson/bytebuddy in our API, shaded refs present."
        continue-on-error: ${{ matrix.smoke }}

      - name: Dependencies diff (regression guard)
        id: deps
        run: ./gradlew :apilens-agent:dependencies --configuration runtimeClasspath
        continue-on-error: ${{ matrix.smoke }}

      # [Phase R30] R30/AC-R30-27 — agent 배포물 안 Jackson 2 판 = 카탈로그 jackson 값(실패 게이트 · primary 만).
      #   agent 시험 클래스패스가 아니라 shadow jar 를 직접 읽는다(시험 클래스패스의 Jackson 은 서버 경유로 더 높다).
      - name: Verify agent jar Jackson line matches the catalog
        if: ${{ !matrix.smoke }}
        run: |
          WANT=$(sed -n 's/^jackson = "\([^"]*\)".*/\1/p' gradle/libs.versions.toml | head -n 1)
          if [ -z "$WANT" ]; then
            echo "ERROR: 카탈로그에서 jackson 판을 못 읽었습니다."
            exit 1
          fi
          mapfile -t AGENT_JARS < <(find apilens-agent/build/libs -name 'apilens-agent*.jar' -not -name '*sources*' -not -name '*plain*' | sort)
          if [ ${#AGENT_JARS[@]} -ne 1 ]; then
            echo "ERROR: agent shadow jar 매칭 개수 비정상 (${#AGENT_JARS[@]}) — 정확히 1개여야 합니다."
            exit 1
          fi
          FAIL=0
          for MOD in core/jackson-core core/jackson-databind datatype/jackson-datatype-jsr310; do
            GOT=$(unzip -p "${AGENT_JARS[0]}" "META-INF/maven/com.fasterxml.jackson.${MOD%%/*}/${MOD##*/}/pom.properties" | sed -n 's/^version=//p')
            echo "${MOD##*/}: jar=$GOT catalog=$WANT"
            if [ "$GOT" != "$WANT" ]; then FAIL=1; fi
          done
          echo "jackson-annotations: jar=$(unzip -p "${AGENT_JARS[0]}" META-INF/maven/com.fasterxml.jackson.core/jackson-annotations/pom.properties | sed -n 's/^version=//p') (기록만)"
          if [ "$FAIL" -ne 0 ]; then
            echo "ERROR: agent jar 안 Jackson 판이 카탈로그 jackson 값과 다릅니다."
            exit 1
          fi
          echo "OK: agent jar Jackson line = $WANT"

      # [Phase R30] R30/AC-R30-29 — 지원 라인 가드(경고 · 종료 코드 늘 0 · primary 만). 주석은 늘 정확히 1(notice 또는 warning).
      - name: Support line guard (Spring Boot OSS support)
        if: ${{ !matrix.smoke }}
        run: bash scripts/check-support-line.sh

      # [Phase R30] R30/AC-R30-31 — smoke 다리 판정 한 줄. 값은 env: 로만 받는다(식 가드).
      - name: Smoke summary (notice)
        if: ${{ always() && matrix.smoke }}
        env:
          O_WRAPPER: ${{ steps.wrapper.outcome }}
          O_LICENSE: ${{ steps.license.outcome }}
          O_EXPRGUARD: ${{ steps.exprguard.outcome }}
          O_TEST: ${{ steps.test.outcome }}
          O_SHADOW: ${{ steps.shadow.outcome }}
          O_RELOCATE: ${{ steps.relocate.outcome }}
          O_JAVAP: ${{ steps.javap.outcome }}
          O_DEPS: ${{ steps.deps.outcome }}
        run: |
          SERVER_JVM=$(head -n 1 apilens-server/build/apilens-test-jvm.txt 2>/dev/null || echo missing)
          COMMON_JVM=$(head -n 1 apilens-common/build/apilens-test-jvm.txt 2>/dev/null || echo missing)
          echo "::notice title=smoke::wrapper=$O_WRAPPER license=$O_LICENSE exprguard=$O_EXPRGUARD test=$O_TEST shadow=$O_SHADOW relocate=$O_RELOCATE javap=$O_JAVAP deps=$O_DEPS server_test_jvm=$SERVER_JVM common_test_jvm=$COMMON_JVM"

  # ============================================================
  # Job 2: frontend-build
  #   Node 20 + npm ci + lint + test + build
  #   빌드 산출물(dist)을 통합 job 으로 넘긴다 — 통합 job 이 화면 자원을 임베드해야 하기 때문이다
  # ============================================================
  frontend-build:
    name: Frontend (Node 20)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # [Phase R26] R26/AC-R26-38 — 「화면 디렉터리가 있는가」를 묻던 확인 단계와 그 조건문 여섯 곳을
      #   **전수 제거**했다(G-R26-13 축). 화면은 이제 항상 있고, 없으면 그것 자체가 실패여야 한다 —
      #   조건이 남아 있으면 디렉터리가 사라진 날 이 job 이 **아무것도 안 하고 초록**이 된다.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apilens-ui/package-lock.json

      - name: npm ci
        working-directory: apilens-ui
        run: npm ci

      # [Phase R30] R30/AC-R30-26 — 배포물(dist 정적 파일)에 들어가는 의존성의 high 이상 취약점은 실패시킨다(삼키지 않는다).
      #   ★못 보는 영역: dev 서버(vite 류) 쪽은 --omit=dev 로 뺐다 — 배포물이 정적 파일이라 받아들인 한계(사용자 명시 결정 UD-R30-15).
      - name: npm audit (production dependencies, high+)
        working-directory: apilens-ui
        run: npm audit --omit=dev --audit-level=high

      - name: npm run lint
        working-directory: apilens-ui
        run: npm run lint

      - name: npm run test
        working-directory: apilens-ui
        run: npm run test

      - name: npm run build
        working-directory: apilens-ui
        run: npm run build

      - name: Upload UI dist
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: apilens-ui/dist
          # 빈 아티팩트가 조용히 올라가면 통합 job 이 원인 없이 빨개진다 — 없으면 여기서 실패시킨다.
          if-no-files-found: error
          retention-days: 1

  # ============================================================
  # Job 3: integration-build
  #   릴리스 경로와 같은 명령으로 돌고, agent jar / 화면 자원 임베드를 단언한다
  #   태그를 밀기 전에 릴리스 경로와 같은 실패를 만난다
  # ============================================================
  integration-build:
    name: Integration (clean build + agent/UI embed)
    runs-on: ubuntu-24.04
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v7

      # download-artifact v8 은 내려받은 파일의 해시가 안 맞으면 오류로 멈춘다(그 판의 릴리스 노트).
      - name: Download UI dist
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: apilens-ui/dist

      # embedUi 가 읽는 경로는 apilens-server/build.gradle.kts 의
      # rootProject.file("apilens-ui/dist") 하나뿐이다. 내려받기 경로가 어긋나면 Gradle 이
      # 화면 없이 빌드해 뒤 단계가 "임베드 안 됨"으로 실패하는데, 그 메시지만으로는
      # 원인이 경로인지 빌드인지 안 갈린다. 그래서 Gradle 앞에서 먼저 본다.
      - name: Verify UI dist landed where embedUi reads it
        run: |
          if [ ! -f apilens-ui/dist/index.html ]; then
            echo "ERROR: apilens-ui/dist/index.html 이 없습니다 — 아티팩트 내려받기 경로를 확인하세요."
            ls -la apilens-ui || true
            exit 1
          fi
          echo "OK: apilens-ui/dist/index.html present."

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # 릴리스 경로(release.yml)와 **같은 명령**이다. 시험이 backend-test 와 겹치지만 그 중복이 목적이다 —
      # 릴리스 부하를 태그 앞으로 당긴다. `-x test` 를 붙이면 "같은 모양" 이 깨지므로 붙이지 않는다.
      - name: Clean build (same command as the release path)
        run: ./gradlew clean build

      - name: Verify agent jar embedded + static embedded (D-02 인용)
        run: |
          ls -la apilens-server/build/libs/
          # 글롭 매칭 1개 단언 — 0개(미산출)/2개 이상(stale 혼입) 즉시 실패
          mapfile -t SERVER_JARS < <(find apilens-server/build/libs -name 'apilens-server-*.jar' -not -name '*plain*' -not -name '*sources*' | sort)
          if [ ${#SERVER_JARS[@]} -ne 1 ]; then
            echo "ERROR: server bootJar 매칭 개수 비정상 (${#SERVER_JARS[@]}) — 정확히 1개여야 합니다: ${SERVER_JARS[*]:-'(none)'}"
            exit 1
          fi
          SERVER_JAR=${SERVER_JARS[0]}
          jar tf "$SERVER_JAR" | tee /tmp/server-jar-entries.txt > /dev/null
          # agent jar embed 검증
          if ! grep -q 'agent/apilens-agent.*\.jar' /tmp/server-jar-entries.txt; then
            echo "ERROR: agent jar not embedded in server bootJar."
            exit 1
          fi
          echo "OK: agent jar embedded."
          # static UI embed 단언 — 릴리스 경로의 하드 단언과 같은 항목을 본다.
          if grep -q 'BOOT-INF/classes/static/index.html' /tmp/server-jar-entries.txt; then
            echo "OK: static UI resources embedded."
          else
            echo "ERROR: static/index.html not embedded in server bootJar."
            echo "  apilens-ui/dist 가 Gradle 실행 전에 놓였는지, embedUi 가 건너뛰지 않았는지 보세요."
            exit 1
          fi
