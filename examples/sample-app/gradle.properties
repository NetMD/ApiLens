# sample-app 전용 gradle 설정
#
# Gradle 8.11.1은 JDK 25를 파싱 못해서 데몬이 25로 뜨면 빌드 자체가 실패.
# 아래 한 줄이 daemon JDK를 21로 강제. 시스템 JAVA_HOME이 25라도 sample-app만
# JDK 21로 동작.
#
# 이 경로는 macOS Homebrew의 openjdk@21 위치. 다른 OS / JDK 위치라면 본인
# 환경에 맞게 수정. JDK 21이 시스템 어디 있는지: /usr/libexec/java_home -V
# 또는 본인이 설치한 경로 확인.

org.gradle.java.home=/opt/homebrew/Cellar/openjdk@21/21.0.11/libexec/openjdk.jdk/Contents/Home
