# sample-app — ApiLens 검증용 미니 Spring Boot 앱
# port 18080 (ApiLens server는 8765, 8080은 다른 로컬 앱이 자주 사용해서 회피)

server:
  port: 18080

spring:
  application:
    name: sample-app

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false      # ApiLens가 SQL 잡으니 중복 콘솔 출력 끔
    open-in-view: false

logging:
  level:
    root: INFO
    com.example.sampleapp: DEBUG
