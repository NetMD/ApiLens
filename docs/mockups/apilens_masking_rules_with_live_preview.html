<div style="padding: 1rem 0;">
  <h2 class="sr-only">ApiLens 마스킹 룰 관리 화면 목업: 라이브 프리뷰가 있는 룰 편집기</h2>

  <div style="display: flex; align-items: center; gap: 12px; padding: 0 1rem 12px; border-bottom: 0.5px solid var(--color-border-tertiary); font-size: 12px;">
    <span style="color: var(--color-text-secondary);">← back</span>
    <span style="font-weight: 500; font-size: 14px;">masking rules</span>
  </div>

  <div style="padding: 16px 1rem 4px;">
    <div style="font-size: 11px; color: var(--color-text-secondary); margin-bottom: 8px; letter-spacing: 0.5px;">DEFAULT · 빌트인</div>
    <div id="apl-defaults" style="display: flex; flex-direction: column; gap: 4px;"></div>
  </div>

  <div style="padding: 14px 1rem 4px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <span style="font-size: 11px; color: var(--color-text-secondary); letter-spacing: 0.5px;">CUSTOM · 회사 룰</span>
      <button style="font-size: 12px; height: 26px; padding: 0 10px;">+ add rule</button>
    </div>
    <div id="apl-customs" style="display: flex; flex-direction: column; gap: 4px;"></div>
  </div>

  <div style="margin: 18px 1rem 0; padding: 14px 16px; background: var(--color-background-secondary); border-radius: var(--border-radius-lg);">
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px;">
      <span style="font-size: 11px; color: var(--color-text-secondary); letter-spacing: 0.5px;">LIVE PREVIEW · 샘플 페이로드</span>
      <span id="apl-preview-counter" style="font-size: 10px; color: var(--color-text-secondary); font-family: var(--font-mono);">3 fields masked</span>
    </div>
    <div id="apl-preview" style="background: var(--color-background-primary); padding: 12px 14px; border-radius: var(--border-radius-md); font-size: 12px; font-family: var(--font-mono); line-height: 1.85; border: 0.5px solid var(--color-border-tertiary);"></div>
  </div>

  <script>
    (function() {
      const defaults = [
        {id: 'd1', name: '주민번호', desc: 'regex · 부분 가림', enabled: true, key: 'ssn'},
        {id: 'd2', name: '카드번호', desc: 'regex (luhn) · 부분 가림', enabled: true, key: 'card'},
        {id: 'd3', name: 'password', desc: 'field name · 전체 가림', enabled: true, key: 'password'},
        {id: 'd4', name: 'token, secret, authorization', desc: 'field name · 전체 가림', enabled: true, key: 'token'}
      ];
      const customs = [
        {id: 'c1', name: 'customerEmail', desc: 'field name · 해시', enabled: true, key: 'email'},
        {id: 'c2', name: 'phoneNumber', desc: 'regex · 부분 가림', enabled: true, key: 'phone'}
      ];

      const samplePayload = [
        {label: 'name',     plain: '"홍길동"',                       maskedKey: null},
        {label: 'ssn',      plain: '"850101-1234567"',               maskedKey: 'ssn',      masked: '"850101-*******"',     ruleName: '주민번호'},
        {label: 'cardNo',   plain: '"4532-1234-5678-9010"',          maskedKey: 'card',     masked: '"4532-****-****-9010"', ruleName: '카드번호'},
        {label: 'password', plain: '"hunter2!"',                     maskedKey: 'password', masked: '"********"',            ruleName: 'password'},
        {label: 'authorization', plain: '"Bearer eyJhbG..."',        maskedKey: 'token',    masked: '"********"',            ruleName: 'token'},
        {label: 'email',    plain: '"jihoon@example.com"',           maskedKey: 'email',    masked: '"#a8f2c1"',             ruleName: 'customerEmail'},
        {label: 'phone',    plain: '"010-1234-5678"',                maskedKey: 'phone',    masked: '"010-****-5678"',       ruleName: 'phoneNumber'},
        {label: 'amount',   plain: '50000',                          maskedKey: null}
      ];

      function renderRow(rule, container) {
        const row = document.createElement('div');
        row.style.cssText = 'display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; padding: 8px 12px; background: var(--color-background-secondary); border-radius: var(--border-radius-md); cursor: pointer;';
        row.innerHTML =
          '<div class="apl-tog" style="width: 26px; height: 16px; border-radius: 8px; position: relative; transition: background 0.15s;">' +
          '<div class="apl-knob" style="position: absolute; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: white; transition: left 0.15s;"></div></div>' +
          '<div><div style="font-size: 13px; font-family: var(--font-mono);">' + rule.name + '</div>' +
          '<div style="font-size: 11px; color: var(--color-text-secondary);">' + rule.desc + '</div></div>' +
          '<button style="font-size: 11px; height: 24px; padding: 0 8px;">edit</button>';
        const togEl = row.querySelector('.apl-tog');
        const knobEl = row.querySelector('.apl-knob');
        function applyVisual() {
          togEl.style.background = rule.enabled ? '#1D9E75' : 'var(--color-border-secondary)';
          knobEl.style.left = rule.enabled ? '12px' : '2px';
        }
        applyVisual();
        row.addEventListener('click', (e) => {
          if (e.target.tagName === 'BUTTON') return;
          rule.enabled = !rule.enabled;
          applyVisual();
          renderPreview();
        });
        container.appendChild(row);
      }

      const defaultsEl = document.getElementById('apl-defaults');
      const customsEl = document.getElementById('apl-customs');
      defaults.forEach(r => renderRow(r, defaultsEl));
      customs.forEach(r => renderRow(r, customsEl));

      function activeKeys() {
        const set = new Set();
        defaults.forEach(r => { if (r.enabled) set.add(r.key); });
        customs.forEach(r => { if (r.enabled) set.add(r.key); });
        return set;
      }

      function renderPreview() {
        const previewEl = document.getElementById('apl-preview');
        const counterEl = document.getElementById('apl-preview-counter');
        const active = activeKeys();
        let maskedCount = 0;
        let html = '<div>{</div>';
        samplePayload.forEach((field, i) => {
          const isMasked = field.maskedKey && active.has(field.maskedKey);
          if (isMasked) maskedCount++;
          const value = isMasked ? field.masked : field.plain;
          const valueStyle = isMasked ? 'color: var(--color-text-secondary);' : '';
          const badge = isMasked
            ? '<span style="font-size: 10px; padding: 1px 6px; background: var(--color-background-info); color: var(--color-text-info); border-radius: 4px; margin-left: 6px;">masked: ' + field.ruleName + '</span>'
            : '';
          const comma = i < samplePayload.length - 1 ? ',' : '';
          html += '<div style="padding-left: 16px;">"' + field.label + '": <span style="' + valueStyle + '">' + value + '</span>' + comma + badge + '</div>';
        });
        html += '<div>}</div>';
        previewEl.innerHTML = html;
        counterEl.textContent = maskedCount + ' fields masked';
      }
      renderPreview();
    })();
  </script>
</div>
