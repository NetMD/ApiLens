<div style="padding: 1rem 0;">
  <h2 class="sr-only">ApiLens 대시보드 목업: 시간축 응답시간 산점도</h2>

  <div style="display: flex; align-items: center; gap: 12px; padding: 0 1rem 12px; border-bottom: 0.5px solid var(--color-border-tertiary);">
    <div style="display: flex; align-items: center; gap: 6px;">
      <div style="width: 18px; height: 18px; border-radius: 4px; background: var(--color-background-info); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: var(--color-text-info);">A</div>
      <span style="font-weight: 500; font-size: 13px;">ApiLens</span>
    </div>
    <div style="display: flex; gap: 8px; margin-left: auto; align-items: center;">
      <select style="font-size: 12px; height: 28px; padding: 0 8px;"><option>order-service</option></select>
      <select style="font-size: 12px; height: 28px; padding: 0 8px;"><option>last 10 min</option></select>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 0 10px; height: 28px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md);">
        <span style="width: 6px; height: 6px; border-radius: 50%; background: #639922;"></span><span>live</span>
      </div>
    </div>
  </div>

  <div style="padding: 14px 1rem 0;">
    <svg viewBox="0 0 640 250" style="width: 100%; height: 250px;">
      <g stroke="var(--color-border-tertiary)" stroke-width="0.5">
        <line x1="48" y1="40" x2="630" y2="40"/>
        <line x1="48" y1="100" x2="630" y2="100"/>
        <line x1="48" y1="160" x2="630" y2="160"/>
        <line x1="48" y1="220" x2="630" y2="220"/>
      </g>
      <text x="42" y="44" text-anchor="end" class="ts" style="font-size: 10px;">2000</text>
      <text x="42" y="104" text-anchor="end" class="ts" style="font-size: 10px;">1000</text>
      <text x="42" y="164" text-anchor="end" class="ts" style="font-size: 10px;">500</text>
      <text x="42" y="224" text-anchor="end" class="ts" style="font-size: 10px;">100</text>
      <text x="14" y="130" text-anchor="middle" class="ts" style="font-size: 10px;" transform="rotate(-90 14 130)">ms</text>
      <text x="80" y="245" text-anchor="middle" class="ts" style="font-size: 10px;">10:30</text>
      <text x="200" y="245" text-anchor="middle" class="ts" style="font-size: 10px;">10:32</text>
      <text x="320" y="245" text-anchor="middle" class="ts" style="font-size: 10px;">10:34</text>
      <text x="440" y="245" text-anchor="middle" class="ts" style="font-size: 10px;">10:36</text>
      <text x="560" y="245" text-anchor="middle" class="ts" style="font-size: 10px;">10:38</text>
      <g id="apilens-dots"></g>
    </svg>
  </div>

  <div style="display: flex; gap: 16px; padding: 8px 1rem 0; font-size: 11px; color: var(--color-text-secondary);">
    <span style="display: inline-flex; align-items: center; gap: 4px;"><span style="display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #888780;"></span>OK</span>
    <span style="display: inline-flex; align-items: center; gap: 4px;"><span style="display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #BA7517;"></span>slow</span>
    <span style="display: inline-flex; align-items: center; gap: 4px;"><span style="display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #E24B4A;"></span>error</span>
    <span style="margin-left: auto; font-size: 11px;">click a dot to open trace</span>
  </div>

  <div style="padding: 16px 1rem 0;">
    <div style="font-size: 12px; color: var(--color-text-secondary); margin-bottom: 8px; letter-spacing: 0.3px;">recent traces</div>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="display: grid; grid-template-columns: 76px 1fr 70px 50px; gap: 12px; padding: 8px 12px; font-size: 12px; border-radius: var(--border-radius-md); background: var(--color-background-secondary); align-items: center;">
        <span style="color: var(--color-text-secondary); font-family: var(--font-mono);">10:38:42</span>
        <span style="font-family: var(--font-mono);">POST /api/orders</span>
        <span style="text-align: right; font-family: var(--font-mono);">450ms</span>
        <span style="text-align: right; color: var(--color-text-success); font-size: 11px;">OK</span>
      </div>
      <div style="display: grid; grid-template-columns: 76px 1fr 70px 50px; gap: 12px; padding: 8px 12px; font-size: 12px; align-items: center;">
        <span style="color: var(--color-text-secondary); font-family: var(--font-mono);">10:38:39</span>
        <span style="font-family: var(--font-mono);">POST /api/orders</span>
        <span style="text-align: right; font-family: var(--font-mono); color: var(--color-text-danger);">1820ms</span>
        <span style="text-align: right; color: var(--color-text-danger); font-size: 11px;">ERR</span>
      </div>
      <div style="display: grid; grid-template-columns: 76px 1fr 70px 50px; gap: 12px; padding: 8px 12px; font-size: 12px; align-items: center;">
        <span style="color: var(--color-text-secondary); font-family: var(--font-mono);">10:38:35</span>
        <span style="font-family: var(--font-mono);">GET /api/users/{id}</span>
        <span style="text-align: right; font-family: var(--font-mono);">12ms</span>
        <span style="text-align: right; color: var(--color-text-success); font-size: 11px;">OK</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const g = document.getElementById('apilens-dots');
      if (!g) return;
      const mapY = (ms) => 240 - (Math.log(ms / 30) / Math.log(2000 / 30)) * 200;
      const seed = (i) => ((i * 9301 + 49297) % 233280) / 233280;
      const ns = 'http://www.w3.org/2000/svg';
      const draw = (x, y, r, color, ring) => {
        if (ring) {
          const o = document.createElementNS(ns, 'circle');
          o.setAttribute('cx', x); o.setAttribute('cy', y); o.setAttribute('r', r + 4);
          o.setAttribute('fill', 'none'); o.setAttribute('stroke', color);
          o.setAttribute('stroke-width', '0.5'); o.setAttribute('opacity', '0.5');
          g.appendChild(o);
        }
        const c = document.createElementNS(ns, 'circle');
        c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', r); c.setAttribute('fill', color);
        g.appendChild(c);
      };
      for (let i = 0; i < 42; i++) {
        const x = 55 + seed(i * 3 + 1) * 565;
        const ms = 35 + seed(i * 7 + 5) * 280;
        draw(x, mapY(ms), 3, '#888780');
      }
      [{x: 145, ms: 1100}, {x: 225, ms: 850}, {x: 380, ms: 1280}, {x: 470, ms: 920}].forEach(d =>
        draw(d.x, mapY(d.ms), 4, '#BA7517')
      );
      draw(545, mapY(1820), 5, '#E24B4A', true);
    })();
  </script>
</div>
